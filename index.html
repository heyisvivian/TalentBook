<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentBook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operator console. Fixed left rail for navigation, one working column, side panel for facts on records. */
:root {
  --bg: #F3F6F7;
  --surface: #FFFFFF;
  --surface-2: #EBF0F1;
  --fg: #14212A;
  --muted: #5A6973;
  --line: #D9E1E4;
  --accent: #0D6B5E;
  --accent-fg: #FFFFFF;
  --accent-soft: #DDEFEA;
  --good: #1D7A4C; --good-soft: #DFF2E7;
  --warn: #9A5B00; --warn-soft: #FBEFD9;
  --bad: #B0281F;  --bad-soft: #FBE3E0;
  --shadow: 0 1px 2px rgba(20,33,42,.06), 0 4px 14px rgba(20,33,42,.06);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1417; --surface: #151E22; --surface-2: #1C272C; --fg: #E4EBEE; --muted: #93A3AB; --line: #2A373D;
  --accent: #4CC2AB; --accent-fg: #06201B; --accent-soft: #15332E;
  --good: #52C68E; --good-soft: #173326; --warn: #E7A947; --warn-soft: #3A2C14; --bad: #F27A6F; --bad-soft: #3D1D1A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1417; --surface: #151E22; --surface-2: #1C272C; --fg: #E4EBEE; --muted: #93A3AB; --line: #2A373D;
  --accent: #4CC2AB; --accent-fg: #06201B; --accent-soft: #15332E;
  --good: #52C68E; --good-soft: #173326; --warn: #E7A947; --warn-soft: #3A2C14; --bad: #F27A6F; --bad-soft: #3D1D1A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.15rem; }
h3 { font-size: .95rem; font-family: var(--f-body); font-weight: 700; letter-spacing: 0; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .92em; }
.muted { color: var(--muted); }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.spacer { flex: 1; }

/* ---------- buttons, inputs, chips ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: .88rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: .8rem; }
a.btn { text-decoration: none; color: inherit; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font: inherit; text-align: left; }
.resume-sheet { background: var(--surface-2); border-radius: 10px; padding: 18px 20px; white-space: pre-wrap; font-size: .88rem; line-height: 1.6; max-height: 60vh; overflow: auto; overflow-wrap: anywhere; }
.chip.role-admin { background: var(--bad-soft); color: var(--bad); }
.chip.role-manager { background: var(--warn-soft); color: var(--warn); }
.chip.role-recruiter { background: var(--accent-soft); color: var(--accent); }
.avatar.xs { width: 22px; height: 22px; font-size: .62rem; }
.stage-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.stage-cell { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; text-align: left; display: grid; gap: 0; }
.stage-cell:hover { border-color: var(--accent); }
.stage-cell b { font-family: var(--f-display); font-size: 1.3rem; }
.stage-cell span { font-size: .76rem; color: var(--muted); }
.board-wrap { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(160px, 1fr)); gap: 8px; min-width: 1010px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col-head { display: flex; justify-content: space-between; font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 2px 4px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: grid; gap: 4px; min-width: 0; }
.pcard.stale { border-left: 3px solid var(--warn); }
.pcard .linkish { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.input.mini { width: auto; padding: 2px 6px; font-size: .76rem; border-radius: 6px; }
.app { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.track i { height: 5px; border-radius: 3px; background: var(--surface-2); }
.track i.on { background: var(--accent); }
.track i.lost { background: var(--bad-soft); }
@media (max-width: 700px) { .stage-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .78rem; font-weight: 600; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; }
textarea.input { resize: vertical; min-height: 72px; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); font-size: .78rem; font-weight: 500; white-space: nowrap; }
.chip.hit { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad  { background: var(--bad-soft); color: var(--bad); }
.chip.outline { background: transparent; border: 1px solid var(--line); }
.chip button { border: 0; background: none; padding: 0 0 0 2px; color: inherit; opacity: .7; font-size: .9rem; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted); flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel > h2, .panel > .panel-head { margin-bottom: 12px; }
.panel-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; }
.empty { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.kv { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 8px 12px; font-size: .88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* ---------- login ---------- */
.login { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: var(--shadow); display: grid; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-size: .95rem; }
.who { display: grid; gap: 8px; }
.who button { display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.who button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .8rem; background: var(--surface-2); color: var(--fg); flex: none; }
.avatar.lg { width: 56px; height: 56px; font-size: 1.1rem; background: var(--accent-soft); color: var(--accent); }
.err { color: var(--bad); font-size: .85rem; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 228px 1fr; min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.rail .brand { padding: 4px 8px 14px; align-items: flex-start; }
.brand .company { display: block; font-family: var(--f-body); font-size: .74rem; font-weight: 600; color: var(--muted); letter-spacing: 0; line-height: 1.3; margin-top: 2px; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-weight: 600; color: var(--muted); text-align: left; }
.nav-btn:hover { background: var(--surface-2); color: var(--fg); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-btn .count { margin-left: auto; font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.rail-foot { margin-top: auto; display: grid; gap: 8px; padding: 10px 8px 0; border-top: 1px solid var(--line); }
.me { display: flex; gap: 10px; align-items: center; min-width: 0; }
.me > div { min-width: 0; }
.me strong { display: block; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me span { font-size: .75rem; color: var(--muted); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: center; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar form { flex: 1; min-width: 0; position: relative; }
.topbar .input { padding-left: 34px; height: 38px; }
.topbar form svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.content { padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; max-width: 1240px; width: 100%; }
.content > * { min-width: 0; }
.page-head { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.page-head > div { min-width: 0; }
.page-head p { color: var(--muted); margin-top: 4px; }

/* ---------- search hero ---------- */
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.ask form { display: flex; gap: 8px; }
.ask .input { font-size: 1rem; height: 46px; }
.ask .btn { height: 46px; padding: 0 18px; }
.understood { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .82rem; }
.demo-note { font-size: .76rem; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; text-align: left; }
button.stat:hover { border-color: var(--muted); }
.stat b { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.1; }
.stat span { font-size: .8rem; color: var(--muted); }

/* ---------- lists ---------- */
.list { display: grid; gap: 8px; }
.cand { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; width: 100%; }
.cand:hover { border-color: var(--accent); }
.cand-main { min-width: 0; display: grid; gap: 4px; }
.cand-name { font-weight: 700; font-size: .98rem; }
.cand-meta { font-size: .82rem; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; }
.cand-side { display: grid; gap: 4px; justify-items: end; text-align: right; font-size: .8rem; }
.why { font-size: .8rem; color: var(--muted); }
.score { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; line-height: 1; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; width: 90px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; background: var(--surface-2); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; text-align: left; align-content: start; }
button.card:hover { border-color: var(--accent); }

/* ---------- profile ---------- */
.profile-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.profile-head h1 { font-size: 1.55rem; }
.two { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.summary { background: var(--accent-soft); border: 1px solid transparent; border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.summary p { max-width: 75ch; }
.memory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.memo { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: var(--surface); font-size: .88rem; }
.memo-top { display: flex; justify-content: space-between; gap: 8px; font-size: .74rem; color: var(--muted); }
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 92px 18px minmax(0, 1fr); gap: 8px; font-size: .88rem; }
.tl-date { color: var(--muted); font-size: .78rem; padding-top: 2px; text-align: right; }
.tl-line { position: relative; display: flex; justify-content: center; }
.tl-line::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl-line i { position: relative; margin-top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.tl-body { padding-bottom: 14px; min-width: 0; }
.tl-body b { font-size: .8rem; }
.pain { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.pain li { display: flex; gap: 8px; font-size: .88rem; }
.pain li::before { content: ""; width: 6px; height: 6px; margin-top: 8px; border-radius: 2px; background: var(--warn); flex: none; }
.pain.moti li::before { background: var(--good); }
.skill-list { display: grid; gap: 6px; }
.skill { display: grid; grid-template-columns: minmax(0,1fr) 70px auto; gap: 8px; align-items: center; font-size: .86rem; }
.skill .bar { width: 100%; }
.breakdown { display: grid; grid-template-columns: 90px minmax(0,1fr) 34px; gap: 4px 8px; font-size: .78rem; align-items: center; }
.breakdown .bar { width: 100%; }
.check { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; font-size: .86rem; padding: 8px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; }
.ic.good { background: var(--good-soft); color: var(--good); } .ic.warn { background: var(--warn-soft); color: var(--warn); } .ic.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- modal & toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,14,18,.45); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 760px; max-height: calc(100% - 16px); overflow: auto; box-shadow: var(--shadow); display: grid; gap: 16px; padding: 20px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 26px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.notice { border-radius: 10px; padding: 10px 12px; font-size: .85rem; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.info { background: var(--surface-2); color: var(--fg); }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .86rem; z-index: 30; box-shadow: var(--shadow); }

@media (max-width: 980px) {
  .two { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); gap: 2px; }
  .rail .brand, .rail-foot .me, .nav-btn .count { display: none; }
  .nav-btn { width: auto; white-space: nowrap; }
  .rail-foot { margin: 0 0 0 auto; border: 0; padding: 0; display: flex; }
  .topbar { top: 0; position: static; }
}
@media (max-width: 560px) {
  .form-grid { grid-template-columns: 1fr; }
  .cand { grid-template-columns: minmax(0, 1fr); }
  .cand > .avatar { display: none; }
  .cand-side { justify-items: start; text-align: left; grid-auto-flow: column; justify-content: start; gap: 10px; }
  .profile-head { grid-template-columns: auto minmax(0,1fr); }
  .profile-head > .row { grid-column: 1 / -1; }
  .ask form { flex-direction: column; }
  .tl { grid-template-columns: 70px 18px minmax(0, 1fr); }
  .topbar .btn span { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .cand, .card, .btn, .nav-btn { transition: border-color .12s, background-color .12s; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* =========================================================================
   TalentBook demo. Everything runs in the browser: seed data, the natural-
   language search parser and the matching score are local functions that
   stand in for a backend and an LLM. Data is kept in localStorage.
   ========================================================================= */

const STORE_KEY = "talentbook-demo-v5";
const TODAY = new Date(); TODAY.setHours(12, 0, 0, 0);
const DAY = 86400000;
const ago = n => new Date(TODAY - n * DAY).toISOString().slice(0, 10);
const daysSince = iso => Math.round((TODAY - new Date(iso + "T12:00:00")) / DAY);
const addDays = (iso, n) => new Date(new Date(iso + "T12:00:00").getTime() + n * DAY).toISOString().slice(0, 10);
const uid = p => p + Math.random().toString(36).slice(2, 9);

/* ---------------- seed data ---------------- */

  else if (kind === "term") f.terms = f.terms.filter(s => s !== val);
  else if (kind === "loc") { const lbls = REGIONS[val] || [CITY_LABEL[val] || val.replace(/\b\w/g, c => c.toUpperCase())]; f.cities = f.cities.filter(c => !lbls.includes(c)); }
  else if (kind === "prov") f.provs = f.provs.filter(p => p !== val);
  else if (kind === "band") { delete f.minPay; delete f.maxPay; }
  else if (kind === "mode") delete f.mode;
  else delete f[kind];
  f.labels = f.labels.filter(l => l[0] !== key);
}
function candidateText(c) { return norm([c.title, ...c.skills.map(s => s.n), ...c.designations, ...c.memory.map(m => m.t), ...c.pains, ...c.motives].join(" ")); }
function runSearch(f, pool) {
  const out = [];
  let relaxedTerms = false;
  const evalSet = useTerms => {
    const res = [];
    for (const c of pool) {
      const why = [];
      if (f.cities.length || f.provs.length) {
        const inCity = f.cities.includes(c.city), inProv = f.provs.includes(c.prov);
        const relocOk = f.relocate || c.relocate; const remoteOk = c.modes.includes("Remote");
        if (inCity || inProv) why.push(`Based in ${c.city}, ${c.prov}`);
        else if (relocOk && c.relocate) why.push(`Open to relocating from ${c.city}`);
        else if (remoteOk && f.mode === "Remote") why.push("Remote");
        else continue;
      }
      if (f.relocate && !c.relocate && !why.some(w => w.startsWith("Based"))) continue;
      if (f.relocate && c.relocate && !why.length) why.push("Open to relocation");
      const sMin = annual(c.salary.min, c.salary.type);
      if (f.maxPay && sMin > f.maxPay) continue;
      if (f.minPay && annual(c.salary.max, c.salary.type) < f.minPay) continue;
      if (f.maxPay || f.minPay) why.push(`Expects ${fmtPay(c.salary)}`);
      const r = recency(c);
      if (f.staleDays && r.days < f.staleDays) continue;
      if (f.recentDays && r.days > f.recentDays) continue;
      if (f.staleDays || f.recentDays) why.push(`Last contact ${r.label.toLowerCase()}`);
      if (f.mode && !c.modes.includes(f.mode)) continue;
      if (f.mode) why.push(`Open to ${f.mode.toLowerCase()}`);
      if (f.french && !c.langs.includes("French")) continue;
      if (f.french) why.push("Speaks French");
      if (f.noLmia && /lmia/i.test(c.auth)) continue;
      if (f.desig && !c.designations.some(d => norm(d).startsWith(norm(f.desig)))) continue;
      if (f.desig) why.push(c.designations.join(", "));
      if (f.minYears && c.years < f.minYears) continue;
      if (f.minYears) why.push(`${c.years} years' experience`);
      if (f.active && c.status !== "Active") continue;
      if (c.status === "Do not contact") continue;
      let score = 50;
      const hits = f.skills.filter(s => c.skills.some(x => x.n === s));
      if (f.skills.length) { if (!hits.length) continue; score += 40 * hits.length / f.skills.length; }
      if (useTerms && f.terms.length) {
        const txt = candidateText(c);
        const termHits = f.terms.filter(w => txt.includes(w));
        if (termHits.length < f.terms.length) continue;
        if (termHits.some(w => norm(c.title).includes(w))) score += 8;
      }
      score -= Math.min(r.days, 365) / 365 * 6;
      res.push({ c, why, hits, score });
    }
    return res;
  };
  let res = evalSet(true);
  if (!res.length && f.terms.length) { res = evalSet(false); relaxedTerms = res.length > 0; }
  res.sort((a, b) => b.score - a.score);
  out.push(...res);
  return { results: out, relaxedTerms };
}

/* ---------------- job matching ---------------- */
function matchScore(c, j) {
  const has = s => c.skills.some(x => x.n === s);
  const mustHit = j.must.filter(has), niceHit = j.nice.filter(has);
  const skills = Math.round((j.must.length ? 45 * mustHit.length / j.must.length : 45) + (j.nice.length ? 10 * niceHit.length / j.nice.length : 10));
  let loc = 0, locNote;
  if (j.modes.includes("Remote") && c.modes.includes("Remote")) { loc = 15; locNote = "Remote on both sides"; }
  else if (c.city === j.city) { loc = 15; locNote = `Lives in ${c.city}`; }
  else if (REGIONS.gta.includes(c.city) && REGIONS.gta.includes(j.city)) { loc = 12; locNote = "Same region (GTA)"; }
  else if (c.prov === j.prov) { loc = 8; locNote = `Same province, ${c.city}`; }
  else if (c.relocate) { loc = 6; locNote = "Would relocate"; }
  else locNote = `${c.city}, ${c.prov}, not open to relocation`;
  const modeOk = c.modes.some(m => j.modes.includes(m)) ? 5 : 0;
  const askMin = annual(c.salary.min, c.salary.type), budget = annual(j.salary.max, j.salary.type);
  let pay = 0, payNote;
  if (askMin <= budget) { pay = 15; payNote = "Ask fits the range"; }
  else if (askMin <= budget * 1.08) { pay = 7; payNote = `Ask is ${fmtK(askMin - budget)} above the top of range`; }
  else payNote = `Ask is ${fmtK(askMin - budget)} above the top of range`;
  const desigOk = !j.designations.length || j.designations.some(d => c.designations.some(x => norm(x).startsWith(norm(d).split(" ")[0])));
  const langOk = !j.langs.length || j.langs.every(l => c.langs.includes(l));
  const authOk = !/lmia/i.test(c.auth);
  const total = Math.max(0, Math.min(100, skills + loc + modeOk + pay + (desigOk ? 6 : 0) + (langOk ? 2 : 0) + (authOk ? 2 : 0)));
  const gaps = [];
  j.must.filter(s => !has(s)).forEach(s => gaps.push(`Missing ${s}`));
  if (!desigOk) gaps.push(`No ${j.designations.join(" / ")}`);
  if (!langOk) gaps.push(`Does not list ${j.langs.join(", ")}`);
  if (!authOk) gaps.push("Needs an LMIA to change employer");
  if (pay < 15) gaps.push(payNote);
  if (!modeOk) gaps.push(`Wants ${c.modes.join("/")}, job is ${j.modes.join("/")}`);
  if (loc === 0) gaps.push(locNote);
  return { total, parts: [["Skills", skills, 55], ["Location", loc + modeOk, 20], ["Salary", pay, 15], ["Credentials", (desigOk ? 6 : 0) + (langOk ? 2 : 0) + (authOk ? 2 : 0), 10]], mustHit, niceHit, gaps, locNote, payNote };
}

/* ---------------- posting compliance (Canadian rules) ---------------- */
function postingChecks(j) {
  const k = client(j.client); const out = [];
  const pay = j.salary && j.salary.min && j.salary.max;
  const payRule = { ON: "Ontario ESA (from 1 Jan 2026)", BC: "BC Pay Transparency Act", PE: "PEI Employment Standards Act" }[j.prov];
  if (payRule) out.push(pay ? ["good", `Pay range disclosed (${payRule})`] : ["bad", `Pay range missing — required under ${payRule}`]);
  else out.push(pay ? ["good", "Pay range disclosed (best practice in " + j.prov + ")"] : ["warn", "No pay range; not mandatory in " + j.prov + " but expected by candidates"]);
  if (j.prov === "ON" && (k?.size || 25) >= 25) {
    const width = annual(j.salary.max, j.salary.type) - annual(j.salary.min, j.salary.type);
    if (pay && annual(j.salary.max, j.salary.type) <= 200000 && width > 50000) out.push(["bad", `Range is ${fmtK(width)} wide; Ontario caps it at $50k for jobs paying up to $200k`]);
    else if (pay) out.push(["good", "Range width within Ontario's $50k limit"]);
    out.push(j.posting.ai ? ["good", "States whether AI is used to screen or assess applicants"] : ["bad", "Missing AI-use statement (Ontario requires disclosure of AI screening)"]);
    out.push(/canadian experience/i.test(j.posting.text) ? ["bad", "Asks for “Canadian experience” — not allowed in Ontario postings or forms"] : ["good", "No Canadian-experience requirement"]);
    out.push(j.posting.vacancy ? ["good", "States the vacancy is an existing role"] : ["bad", "Must state whether the posting is for an existing vacancy"]);
    out.push(["good", "45-day post-interview reply reminder is on for this job"]);
  }
  if (j.prov === "QC") out.push(j.posting.fr ? ["good", "French version of posting (Charter of the French Language)"] : ["warn", "Publish a French version; Québec postings must be available in French"]);
  if (j.prov === "ON") { const lic = DB.company.licence || ""; out.push(/ON recruiter licence/.test(lic) ? ["good", `Company licensed under Ontario ESA (${lic.replace("ON recruiter licence ", "")})`] : ["warn", "Recruiting for Ontario: the company needs an Ontario recruiter licence"]); }
  return out;
}

  return `${esc(first)} is ${/^[aeiou]/i.test(c.title) ? "an" : "a"} ${esc(c.title)}${desig.length ? ` (${esc(desig.join(", "))})` : ""} in ${esc(c.city)} with ${c.years} years' experience, strongest in ${esc(c.skills.slice(0, 3).map(s => s.n).join(", "))}. `
    + `Expects ${fmtPay(c.salary)}${c.salary.type === "annual" ? " base" : ""}, wants ${esc(c.modes.join(" or ").toLowerCase())} work${c.relocate ? " and would relocate" : ""}. `
    + (c.pains[0] ? `Main reason to move: ${esc(c.pains[0].charAt(0).toLowerCase() + c.pains[0].slice(1))}. ` : "")
    + (lc ? `Last contact ${r.label.toLowerCase()} by ${lc.type.toLowerCase()}: ${esc(lc.s)} ` : "")
    + (best && best.m.total >= 50 ? `Best open match: <strong>${esc(best.j.title)}</strong> at ${esc(client(best.j.client).name)} (${best.m.total}/100).` : "No strong match among your open jobs.");
}

  const matches = visJobs().filter(j => j.status === "Open").map(j => ({ j, m: matchScore(c, j) })).sort((a, b) => b.m.total - a.m.total);
  const comms = c.comms.slice().sort((a, b) => b.d.localeCompare(a.d));

        <div class="row" style="margin-top:6px"><span class="chip ${r.cls}"><span class="dot ${r.cls}"></span>Last contact ${r.label.toLowerCase()}</span><span class="chip">${esc(c.status)}</span>${c.designations.map(d => `<span class="chip outline">${esc(d)}</span>`).join("")}<span class="chip ${k.cls}">${k.label}</span>${ed ? "" : `<span class="chip warn">${esc(firstName(c.owner))}'s candidate · view only</span>`}</div></div>
      ${!ed ? "" : `<div class="row"><select class="input" id="status-sel" style="width:auto" aria-label="Candidate status">${["Active", "Passive", "Placed", "Do not contact"].map(s => `<option ${s === c.status ? "selected" : ""}>${s}</option>`).join("")}</select><button class="btn primary" data-act="log">Log contact</button></div>`}

      ${c.linkedin ? `<a class="btn" href="${esc(c.linkedin)}" target="_blank" rel="noopener noreferrer">${icons.linkedin}LinkedIn profile ↗</a>` : (ed ? `<button class="btn" data-act="edit-linkedin">${icons.linkedin}Add LinkedIn</button>` : "")}

    ${ui.modal === "linkedin" ? `<form id="li-form" class="row"><input class="input" id="li-url" style="flex:1;min-width:220px" placeholder="https://www.linkedin.com/in/name" value="${esc(c.linkedin)}" aria-label="LinkedIn profile URL"><button class="btn primary sm">Save link</button><button type="button" class="btn ghost sm" data-act="close">Cancel</button>${ui.liErr ? `<span class="err">${esc(ui.liErr)}</span>` : ""}</form>` : ""}
    <div class="summary"><span class="eyebrow">AI summary</span><p>${aiSummary(c)}</p></div>
    <div class="two">
      <div class="stack">
        <section class="panel"><div class="panel-head"><h2>Memory cards</h2><span class="muted" style="font-size:.82rem">Things to remember before the next call</span><span class="spacer"></span>${ed ? `<button class="btn sm" data-act="add-memo">Add card</button>` : ""}</div>
          ${ui.modal === "memo" ? `<form id="memo-form" class="stack" style="margin-bottom:12px"><div class="form-grid"><div class="field"><label for="memo-tag">Type</label><select class="input" id="memo-tag">${["Preference", "Compensation", "Pain point", "Work authorization", "Client feedback", "Personal"].map(t => `<option>${t}</option>`).join("")}</select></div><div class="field full"><label for="memo-text">Note</label><textarea class="input" id="memo-text" required placeholder="e.g. Wants to avoid downtown commute"></textarea></div></div><div class="row"><button class="btn primary sm">Save card</button><button type="button" class="btn ghost sm" data-act="close">Cancel</button></div><p class="demo-note">Do not record age, health, family status or other protected grounds unless the candidate offered it and it matters to the job.</p></form>` : ""}
          <div class="memory-grid">${memory.map(m => `<div class="memo"><div class="memo-top"><span class="chip">${esc(m.tag)}</span><span>${fmtDate(m.d)}</span></div><p>${esc(m.t)}</p></div>`).join("") || `<div class="empty">No memory cards yet.</div>`}</div>
        </section>
        <div class="two" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
          <section class="panel"><h2>Pain points</h2><ul class="pain">${c.pains.map(p => `<li>${esc(p)}</li>`).join("") || "<li>None recorded</li>"}</ul></section>
          <section class="panel"><h2>What would make them move</h2><ul class="pain moti">${c.motives.map(p => `<li>${esc(p)}</li>`).join("") || "<li>None recorded</li>"}</ul></section>
        </div>
        <section class="panel"><div class="panel-head"><h2>Communication history</h2><span class="spacer"></span>${ed ? `<button class="btn sm" data-act="log">Log contact</button>` : ""}</div>
          ${ui.modal === "log" ? `<form id="log-form" class="stack" style="margin-bottom:14px"><div class="form-grid"><div class="field"><label for="log-type">Channel</label><select class="input" id="log-type">${["Call", "Email", "Meeting", "LinkedIn", "SMS"].map(t => `<option>${t}</option>`).join("")}</select></div><div class="field"><label for="log-date">Date</label><input class="input" type="date" id="log-date" value="${TODAY.toISOString().slice(0, 10)}"></div><div class="field full"><label for="log-text">Summary</label><textarea class="input" id="log-text" required placeholder="What did you discuss? Any change in salary, availability or interest?"></textarea></div></div><label class="row" style="font-size:.85rem"><input type="checkbox" id="log-memo"> Also save as a memory card</label><div class="row"><button class="btn primary sm">Save</button><button type="button" class="btn ghost sm" data-act="close">Cancel</button></div>${c.consent?.casl !== "Express" ? `<p class="notice warn">CASL: only implied consent for electronic messages. Ask for express consent before sending job alerts by email or SMS.</p>` : ""}</form>` : ""}
          <div class="timeline">${comms.map(x => `<div class="tl"><span class="tl-date">${fmtDate(x.d)}</span><span class="tl-line"><i></i></span><div class="tl-body"><b>${esc(x.type)}</b> <span class="muted" style="font-size:.78rem">· ${daysSince(x.d)}d ago</span><p>${esc(x.s)}</p></div></div>`).join("") || `<div class="empty">No contact logged yet.</div>`}</div>
        </section>
      </div>
      <div class="stack">
        <section class="panel"><h2>Key facts</h2><dl class="kv">

          <dt>Location</dt><dd>${esc(c.city)}, ${c.prov}</dd>
          <dt>Work mode</dt><dd>${c.modes.join(" / ")}</dd>
          <dt>Relocation</dt><dd>${c.relocate ? "Open to relocating" : "Not open"}</dd>
          <dt>Notice period</dt><dd>${esc(c.notice)}</dd>
          <dt>Work authorization</dt><dd>${esc(c.auth)}${/lmia/i.test(c.auth) ? ` <span class="chip warn">LMIA</span>` : ""}</dd>
          <dt>Languages</dt><dd>${c.langs.join(", ")}</dd>
          <dt>Contact</dt><dd>${esc(c.email)}<br><span class="num">${esc(c.phone)}</span></dd>
          <dt>Résumé</dt><dd>${c.resume ? `<button class="linkish" data-act="view-resume">${esc(c.resume)}</button><br><span class="muted" style="font-size:.8rem">Added ${fmtDate(c.resumeDate || c.consent.date)}</span>` : "None on file"}</dd>
          <dt>LinkedIn</dt><dd>${c.linkedin ? `<a href="${esc(c.linkedin)}" target="_blank" rel="noopener noreferrer">${esc(c.linkedin.replace(/^https?:\/\/(www\.)?/, ""))}</a>` : (ed ? `<button class="linkish" data-act="edit-linkedin">Add link</button>` : "—")}</dd>
        </dl></section>
        <section class="panel"><div class="panel-head"><h2>Pipeline</h2><span class="muted" style="font-size:.82rem">Jobs this candidate is in</span></div>
          ${apps.length ? `<div class="list">${apps.map(({ j, p, i }) => `<div class="app">
            <div class="row"><button class="linkish" style="font-weight:700" data-job="${j.id}">${esc(j.title)}</button><span class="spacer"></span><span class="chip ${stageCls(p.stage)}">${p.stage}</span></div>
            <span class="muted" style="font-size:.8rem">${esc(client(j.client).name)} · ${daysSince(p.since)} days in stage</span>
            ${stageTrack(p.stage)}
            <span class="why">${p.history.map(h => `${h.stage} ${fmtDate(h.d).replace(/, \d{4}$/, "")}`).join(" → ")}</span>
          </div>`).join("")}</div>` : `<div class="empty">Not in any pipeline yet. Shortlist from a job page.</div>`}</section>
        <section class="panel"><h2>Skills</h2><div class="skill-list">${c.skills.map(s => `<div class="skill"><span>${esc(s.n)}</span><span class="bar"><i style="width:${Math.round(s.y / maxY * 100)}%"></i></span><span class="num muted">${s.y}y</span></div>`).join("")}</div></section>
        <section class="panel"><h2>Matching open jobs</h2><div class="list">${matches.map(({ j, m }) => `<button class="card" data-job="${j.id}"><span class="row"><strong style="flex:1;min-width:0">${esc(j.title)}</strong><span class="score">${m.total}</span></span><span class="muted" style="font-size:.8rem">${esc(client(j.client).name)} · ${esc(j.city)}</span><span class="bar" style="width:100%"><i style="width:${m.total}%"></i></span>${m.gaps.length ? `<span class="why">${esc(m.gaps.slice(0, 2).join(" · "))}</span>` : `<span class="why" style="color:var(--good)">No gaps found</span>`}</button>`).join("") || `<div class="empty">No open jobs on your desk.</div>`}</div></section>
        <section class="panel"><h2>Privacy &amp; consent</h2><dl class="kv">
          <dt>Consent</dt><dd>${c.consent && c.consent.method !== "Pending" ? `${esc(c.consent.method)}, ${fmtDate(c.consent.date)}` : `<span class="chip bad">Pending</span>`}</dd>
          <dt>CASL (email/SMS)</dt><dd>${esc(c.consent?.casl || "None")}${c.consent?.casl === "Implied" ? ` <span class="chip warn">expires ${fmtDate(addDays(c.consent.date, 730))}</span>` : ""}</dd>
          <dt>Keep record until</dt><dd>${c.consent ? fmtDate(c.consent.retainUntil) : "—"} <span class="chip ${k.cls}">${k.label}</span></dd>
        </dl><div class="row" style="margin-top:12px">${ed ? `<button class="btn sm" data-act="renew">Record renewed consent</button>` : ""}<button class="btn sm ghost" data-act="export">Access request export</button></div></section>
      </div>
    </div>`;
}

function viewJobs() {
  const js = visJobs();
  return `<div class="page-head"><div><h1>${can("viewAll") ? "Jobs" : "My jobs"}</h1><p>${can("viewAll") ? "Every job the company is working on, and who it is assigned to." : "Jobs your manager assigned to you, with the best candidates already on your desk."}</p></div><span class="spacer"></span>${can("addJob") ? `<button class="btn primary" data-act="add-job">+ New job</button>` : ""}</div>
    ${js.length ? "" : `<div class="empty">No jobs are assigned to you yet. Your manager assigns jobs from the job page.</div>`}
    <div class="cards">${js.map(j => { const ms = visCands().map(c => matchScore(c, j).total).sort((a, b) => b - a); const issues = postingChecks(j).filter(x => x[0] === "bad").length;
      return `<button class="card" data-job="${j.id}">
        <span class="row"><span class="chip ${j.status === "Open" ? "good" : ""}">${j.status}</span><span class="chip">${j.type}</span>${issues ? `<span class="chip bad">${issues} posting issue${issues > 1 ? "s" : ""}</span>` : `<span class="chip good">Posting compliant</span>`}</span>
        <strong style="font-size:1rem">${esc(j.title)}</strong>
        <span class="muted" style="font-size:.84rem">${esc(client(j.client).name)}<br>${esc(j.city)}, ${j.prov} · ${j.modes.join(" / ")} · <span class="num">${fmtPay(j.salary)}</span></span>
        <span class="chips">${j.must.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</span>
        <span class="row" style="font-size:.8rem"><span class="bar"><i style="width:${ms[0] || 0}%"></i></span>${ms.filter(x => x >= 60).length} strong matches · ${j.pipeline.length} in pipeline</span>
        <span class="muted" style="font-size:.78rem">Assigned to ${j.recruiters.length ? esc(j.recruiters.map(firstName).join(", ")) : "nobody yet"}</span>
      </button>`; }).join("")}</div>`;
}

const STAGES = ["Sourced", "Contacted", "Submitted", "Interview", "Offer", "Placed", "Not a fit"];
function viewJob() {
  const j = job(ui.id);
  if (!j || !visJobs().includes(j)) return `<div class="empty">This job is not assigned to you.</div>`;
  const k = client(j.client);
  const scored = visCands().filter(c => c.status !== "Do not contact").map(c => ({ c, m: matchScore(c, j) })).sort((a, b) => b.m.total - a.m.total);
  const ranked = scored.filter(x => x.m.mustHit.length), hidden = scored.length - ranked.length;
  const inPipe = new Set(j.pipeline.map(p => p.c));
  return `<div><button class="btn ghost sm" data-go="jobs">← ${can("viewAll") ? "Jobs" : "My jobs"}</button></div>
    <div class="page-head"><div><h1>${esc(j.title)}</h1><p>${esc(k.name)} · ${esc(j.city)}, ${j.prov} · ${j.modes.join(" / ")} · ${j.type} · <span class="num">${fmtPay(j.salary)}</span> · opened ${daysSince(j.opened)} days ago</p></div><span class="spacer"></span>
      ${can("editJob") ? `<select class="input" id="job-status" style="width:auto" aria-label="Job status">${["Open", "On hold", "Filled", "Closed"].map(st => `<option ${st === j.status ? "selected" : ""}>${st}</option>`).join("")}</select>` : `<span class="chip ${j.status === "Open" ? "good" : ""}">${j.status}</span>`}</div>
    <div class="two">
      <div class="stack">
        <section class="panel"><div class="panel-head"><h2>${can("viewAll") ? "Best candidates in the company" : "Best candidates on your desk"}</h2><span class="muted" style="font-size:.82rem">Score out of 100: skills 55, location 20, salary 15, credentials 10</span></div>
          <div class="list">${ranked.map(({ c, m }) => `<div class="cand" style="cursor:default">
            <span class="score" style="width:42px;text-align:center">${m.total}</span>
            <span class="cand-main">
              <span class="row"><button class="btn ghost sm" style="padding:0;font-weight:700;font-size:.98rem;color:var(--fg)" data-open="${c.id}">${esc(c.name)}</button><span class="muted" style="font-size:.84rem">${esc(c.title)} · ${esc(c.city)} · <span class="num">${fmtPay(c.salary)}</span>${c.owner !== me ? ` · ${esc(firstName(c.owner))}'s desk` : ""}</span></span>
              <span class="chips">${j.must.map(s => `<span class="chip ${m.mustHit.includes(s) ? "hit" : "bad"}">${esc(s)}</span>`).join("")}${m.niceHit.map(s => `<span class="chip hit">${esc(s)}</span>`).join("")}</span>
              <span class="breakdown">${m.parts.map(([l, v, max]) => `<span class="muted">${l}</span><span class="bar"><i style="width:${v / max * 100}%"></i></span><span class="num">${v}/${max}</span>`).join("")}</span>
              ${m.gaps.length ? `<span class="why">Gaps: ${esc(m.gaps.join(" · "))}</span>` : `<span class="why" style="color:var(--good)">No gaps found</span>`}
            </span>
            <span class="cand-side">${inPipe.has(c.id) ? `<span class="chip good">In pipeline</span>` : (c.owner === me || can("viewAll")) ? `<button class="btn sm" data-shortlist="${c.id}">Shortlist</button>` : ""}<span class="row" style="gap:6px"><span class="dot ${recency(c).cls}"></span>${recency(c).label}</span></span>
          </div>`).join("") || `<div class="empty">Nobody on your desk has the must-have skills yet. Upload résumés or widen the search.</div>`}</div>
          ${hidden ? `<p class="muted" style="font-size:.8rem;margin-top:10px">${hidden} other candidate${hidden === 1 ? " has" : "s have"} none of the must-have skills and ${hidden === 1 ? "is" : "are"} not shown.</p>` : ""}</section>
      </div>
      <div class="stack">
        ${can("assign") ? `<section class="panel"><h2>Assigned recruiters</h2><div class="stack" style="gap:6px">${recruiterUsers().map(u => `<label class="row" style="font-size:.88rem"><input type="checkbox" data-assign="${u.id}" ${j.recruiters.includes(u.id) ? "checked" : ""}> ${esc(u.name)} <span class="muted" style="font-size:.78rem">${esc(u.desk)}</span></label>`).join("")}</div><p class="demo-note" style="margin-top:8px">Assigned recruiters see this job and can work it with their own candidates.</p></section>` : `<section class="panel"><h2>Assigned to</h2><p>${esc(j.recruiters.map(id => recruiter(id)?.name).join(", "))}</p><p class="muted" style="font-size:.8rem;margin-top:6px">Managed by ${esc(recruiter(j.manager)?.name || "—")}</p></section>`}
        <section class="panel"><div class="panel-head"><h2>Pipeline</h2><span class="spacer"></span><button class="btn ghost sm" data-pipejob="${j.id}">Board view</button></div>${j.pipeline.length ? `<div class="list">${j.pipeline.map((p, i) => { const c = cand(p.c); const mineOrMgr = c.owner === me || can("viewAll"); return `<div class="row"><button class="btn ghost sm" style="flex:1;justify-content:flex-start;color:var(--fg);min-width:0" data-open="${c.id}" ${visCands().includes(c) ? "" : "disabled"}>${esc(c.name)}${c.owner !== me ? ` <span class="muted" style="font-weight:500">· ${esc(firstName(c.owner))}</span>` : ""}</button><span class="muted num" style="font-size:.75rem">${daysSince(p.since)}d</span>${mineOrMgr ? `<select class="input" style="width:auto" data-pstage="${j.id}:${i}" aria-label="Stage for ${esc(c.name)}">${STAGES.map(s => `<option ${s === p.stage ? "selected" : ""}>${s}</option>`).join("")}</select>` : `<span class="chip">${p.stage}</span>`}</div>`; }).join("")}</div>` : `<div class="empty">Shortlist candidates from the ranking to start the pipeline.</div>`}</section>
        <section class="panel"><h2>What ${esc(k.name)} cares about</h2><ul class="pain moti">${k.prefs.map(p => `<li>${esc(p)}</li>`).join("")}</ul>${k.avoid.length ? `<h3 style="margin:12px 0 6px">Avoid</h3><ul class="pain">${k.avoid.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}<p class="muted" style="font-size:.8rem;margin-top:10px">Fee ${esc(k.fee)} · guarantee ${esc(k.guarantee)}</p></section>
        <section class="panel"><h2>Job posting check</h2><p class="muted" style="font-size:.8rem;margin-bottom:6px">Rules for ${j.prov} postings</p>${postingChecks(j).map(([s, t]) => `<div class="check"><span class="ic ${s}">${s === "good" ? "✓" : s === "warn" ? "!" : "✕"}</span><span>${esc(t)}</span></div>`).join("")}
          <dl class="kv" style="margin-top:10px"><dt>Posting text</dt><dd>${esc(j.posting.text)}</dd><dt>AI statement</dt><dd>${esc(j.posting.ai || "None")}</dd></dl></section>
      </div>
    </div>`;
}

function pipeEntries() {
  return visJobs().flatMap(j => j.pipeline.map((p, i) => ({ j, p, i, c: cand(p.c) })))
    .filter(x => x.c && (can("viewAll") || x.c.owner === me));
}
const stuck = x => !["Placed", "Not a fit"].includes(x.p.stage) && daysSince(x.p.since) > 14;
const stageCls = st => ({ Offer: "good", Placed: "good", "Not a fit": "bad", Interview: "hit" }[st] || "");
function stageTrack(stage) {
  const lost = stage === "Not a fit", at = STAGES.indexOf(stage);
  return `<span class="track" aria-label="Stage ${esc(stage)}">${STAGES.slice(0, 6).map((st, i) => `<i class="${lost ? "lost" : i <= at ? "on" : ""}" title="${st}"></i>`).join("")}</span>`;
}
function viewPipeline() {
  let es = pipeEntries();
  if (ui.pipeJob !== "all") es = es.filter(x => x.j.id === ui.pipeJob);
  if (can("viewAll") && ui.pipeRec !== "all") es = es.filter(x => x.c.owner === ui.pipeRec || x.j.recruiters.includes(ui.pipeRec) && x.p.by === ui.pipeRec);
  const cols = STAGES.slice(0, 6), lost = es.filter(x => x.p.stage === "Not a fit");
  const card = x => `<div class="pcard ${stuck(x) ? "stale" : ""}">
      <div class="row" style="gap:6px;flex-wrap:nowrap"><button class="linkish" style="font-weight:700;color:var(--fg);text-decoration:none" data-open="${x.c.id}">${esc(x.c.name)}</button><span class="spacer"></span>${can("viewAll") ? `<span class="avatar xs" title="${esc(recruiter(x.c.owner)?.name || "")}">${recruiter(x.c.owner)?.initials || "?"}</span>` : ""}</div>
      <button class="linkish" style="font-size:.8rem;color:var(--muted);text-decoration:none" data-job="${x.j.id}">${esc(x.j.title)} · ${esc(client(x.j.client).name)}</button>
      <div class="row" style="gap:6px"><span class="num ${stuck(x) ? "" : "muted"}" style="font-size:.74rem;white-space:nowrap;${stuck(x) ? "color:var(--warn);font-weight:600" : ""}">${daysSince(x.p.since)}d in stage</span><span class="spacer"></span>
        <select class="input mini" data-pstage="${x.j.id}:${x.i}" aria-label="Move ${esc(x.c.name)}">${STAGES.map(st => `<option ${st === x.p.stage ? "selected" : ""}>${st}</option>`).join("")}</select></div>
    </div>`;

function extractFromText(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const email = (text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/) || [""])[0];
  const phone = (text.match(/(?:\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/) || [""])[0];
  const name = lines.find(l => /^[A-ZÀ-Ý][a-zà-ÿ'’-]+(?:\s+[A-ZÀ-Ý][a-zà-ÿ'’-]+){1,3}$/.test(l)) || "";
  const title = lines.find(l => /(engineer|manager|developer|designer|superintendent|consultant|analyst|technologist|architect|ingénieur)/i.test(l) && l.length < 70) || "";
  const t = " " + norm(text) + " ";
  const cityKey = Object.keys(CITIES).map(k => [k, t.indexOf(k)]).filter(x => x[1] >= 0).sort((a, b) => a[1] - b[1] || b[0].length - a[0].length)[0]?.[0];
  const skills = knownSkills().filter(s => t.includes(norm(s)));
  Object.entries(SKILL_ALIASES).forEach(([a, s]) => { if (new RegExp("\\b" + a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(t) && !skills.includes(s)) skills.push(s); });
  const designations = [];
  if (/p\.?\s?eng/i.test(text)) designations.push("P.Eng"); if (/\bEIT\b/.test(text)) designations.push("EIT"); if (/\bPMP\b/.test(text)) designations.push("PMP"); if (/\bOIQ\b|\bing\.\s/.test(text)) designations.push("ing. (OIQ)");
  const yrs = (text.match(/(\d{1,2})\+?\s+years/i) || [])[1];
  const langs = ["English"]; if (/french|français|bilingual/i.test(text)) langs.push("French");
  const linkedin = (text.match(/(?:https?:\/\/)?(?:[a-z]{2,3}\.)?linkedin\.com\/in\/[\w%-]+\/?/i) || [""])[0];
  const protectedHits = ["date of birth", "dob", "marital status", "married", "religion", "nationality", "age:"].filter(p => t.includes(p));
  return { name, title: title.replace(/,\s*(p\.?eng|eit|pmp).*$/i, ""), email, phone, city: cityKey ? (CITY_LABEL[cityKey] || cityKey.replace(/\b\w/g, c => c.toUpperCase())) : "", prov: cityKey ? CITIES[cityKey] : "ON", skills, designations, years: yrs ? +yrs : "", langs, linkedin, protectedHits };
}

      const tc = await (await pdf.getPage(p)).getTextContent();
      let lastY = null;
      tc.items.forEach(it => { const y = it.transform[5]; out += (lastY !== null && Math.abs(y - lastY) > 4 ? "\n" : " ") + it.str; lastY = y; });
      out += "\n";
    }
    return out;
  }
  if (ext === "docx") {
    if (!window.mammoth) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    return (await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
  }
  throw new Error("Use a PDF, Word (.docx) or text file.");
}
function findDuplicate(u) {
  const e = norm(u.email), n = norm(u.name);
  return DB.candidates.find(c => (e && norm(c.email) === e) || (n && norm(c.name) === n));
}

function viewResume() {
  const c = cand(ui.id); if (!c) return "";
  return `<div class="scrim" data-act="close-scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="cv-title">

      ${c.linkedin ? `<a class="btn sm" href="${esc(c.linkedin)}" target="_blank" rel="noopener noreferrer">${icons.linkedin}LinkedIn ↗</a>` : ""}<button class="btn ghost sm" data-act="close">Close</button></div>

    <p class="demo-note">${c.resumeText ? "Text extracted from the uploaded file. The original file is not stored in this demo." : "Demo record: this résumé is generated from the profile. Uploaded résumés show their real text here."}</p>
  </div></div>`;
}

/* ---------------- render & events ---------------- */
function render() {
  const app = document.getElementById("app");
  const focusId = document.activeElement?.id, selStart = document.activeElement?.selectionStart;
  if (!me) { app.innerHTML = viewLogin(); return; }
  const views = { home: viewHome, pipeline: viewPipeline, team: viewTeam, candidates: viewCandidates, candidate: viewCandidate, jobs: viewJobs, job: viewJob, clients: viewClients, client: viewClient, compliance: viewCompliance };
  app.innerHTML = shell((views[ui.view] || viewHome)()) + (ui.modal === "upload" ? viewUpload() : ui.modal === "resume" ? viewResume() : ui.modal === "client" ? viewAddClient() : ui.modal === "job" ? viewAddJob() : "") + (ui.toast ? `<div class="toast" role="status">${esc(ui.toast)}</div>` : "");
  if (focusId) { const el = document.getElementById(focusId); if (el && el.focus) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  const drop = document.getElementById("drop");
  if (drop) {
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });
  }
}
async function handleFile(file) {
  ui.upload = { file: file.name, busy: true }; render();
  try {
    const text = await readFile(file);
    if (!text.trim()) throw new Error("No text found. Scanned PDFs need OCR, which this demo does not include.");
    ui.upload = { file: file.name, text, data: extractFromText(text) };
  } catch (e) { ui.upload = { file: file.name, err: e.message }; }
  render();
}
function doSearch(q) { ui.query = q; ui.filters = q.trim() ? parseQuery(q) : null; ui.view = "home"; ui.modal = null; render(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-pick],[data-go],[data-open],[data-job],[data-client],[data-act],[data-q],[data-drop],[data-cf],[data-shortlist],[data-pipejob]");
  if (!t) return;
  const d = t.dataset;
  if (d.pick) { ui.loginPick = d.pick; ui.loginErr = null; render(); return; }
  if (d.drop) { dropFilter(ui.filters, d.drop); render(); return; }
  if (d.q) { doSearch(d.q); return; }
  if (d.cf) { ui.candFilter = d.cf; render(); return; }
  if (d.go) { if (d.go === "home") { ui.filters = null; ui.query = ""; } if (d.go === "pipeline" && t.classList.contains("nav-btn")) { ui.pipeJob = "all"; } go(d.go); return; }
  if (d.open) { e.stopPropagation(); go("candidate", d.open); return; }
  if (d.job) { go("job", d.job); return; }
  if (d.client) { go("client", d.client); return; }
  if (d.pipejob) { ui.pipeJob = d.pipejob; ui.pipeRec = "all"; go("pipeline"); return; }
  if (d.shortlist) { const c = cand(d.shortlist); job(ui.id).pipeline.push({ c: c.id, stage: "Sourced", by: c.owner, since: ago(0), history: [{ stage: "Sourced", d: ago(0) }] }); save(); toast("Added to pipeline"); return; }
  const c = ui.view === "candidate" ? cand(ui.id) : null;
  switch (d.act) {
    case "logout": setMe(null); ui.view = "home"; ui.filters = null; ui.query = ""; render(); break;
    case "upload": ui.modal = "upload"; ui.upload = null; render(); break;
    case "upload-reset": ui.upload = null; render(); break;
    case "sample": ui.upload = { file: "Nadia_Bouchard_CV.txt", text: SAMPLE_CV, data: extractFromText(SAMPLE_CV) }; render(); break;
    case "close-scrim": if (e.target === t) { ui.modal = null; render(); } break;
    case "close": ui.modal = null; render(); break;
    case "clear-search": ui.filters = null; ui.query = ""; render(); break;
    case "log": ui.modal = ui.modal === "log" ? null : "log"; render(); document.getElementById("log-text")?.focus(); break;
    case "add-job": if (!can("addJob")) break; ui.jobClient = d.clientId || null; ui.modal = "job"; render(); document.getElementById("jb-title")?.focus(); break;
    case "add-client": if (!can("addClient")) break; ui.modal = "client"; render(); document.getElementById("k-name")?.focus(); break;
    case "view-resume": ui.modal = "resume"; render(); break;
    case "edit-linkedin": ui.modal = ui.modal === "linkedin" ? null : "linkedin"; ui.liErr = null; render(); document.getElementById("li-url")?.focus(); break;
    case "add-memo": ui.modal = ui.modal === "memo" ? null : "memo"; render(); document.getElementById("memo-text")?.focus(); break;
    case "renew": c.consent = { date: ago(0), method: "Email reply", casl: "Express", retainUntil: addDays(ago(0), 730) }; save(); toast("Consent renewed for 24 months"); break;
    case "export": {
      const data = JSON.stringify(c, null, 2);
      const done = () => toast("Candidate record copied to clipboard");
      try { navigator.clipboard.writeText(data).then(done, () => toast("Copy blocked by the browser")); } catch (err) { toast("Copy blocked by the browser"); }
      break;
    }
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "file-in" && e.target.files[0]) handleFile(e.target.files[0]);
  if (e.target.id === "status-sel") { cand(ui.id).status = e.target.value; save(); toast("Status updated"); }
  if (e.target.dataset.pstage) {
    const [jid, i] = e.target.dataset.pstage.split(":"), p = job(jid).pipeline[+i];
    if (p.stage !== e.target.value) { p.stage = e.target.value; p.since = ago(0); p.history.push({ stage: p.stage, d: ago(0) }); save(); toast(`Moved to ${p.stage}`); }
  }
  if (e.target.id === "pipe-job") { ui.pipeJob = e.target.value; render(); }
  if (e.target.id === "pipe-rec") { ui.pipeRec = e.target.value; render(); }
  if (e.target.id === "cand-owner") { ui.candOwner = e.target.value; render(); }
  if (e.target.id === "job-status" && can("editJob")) { job(ui.id).status = e.target.value; save(); toast("Job status updated"); }
  if (e.target.dataset.assign && can("assign")) {
    const j = job(ui.id), id = e.target.dataset.assign;
    j.recruiters = e.target.checked ? [...new Set([...j.recruiters, id])] : j.recruiters.filter(x => x !== id); save(); toast(e.target.checked ? `Assigned to ${firstName(id)}` : `Removed ${firstName(id)}`);
  }
  if (e.target.dataset.role && can("manageUsers")) { recruiter(e.target.dataset.role).role = e.target.value; save(); toast("Role updated"); }
  if (e.target.id === "jb-client") { const k = client(e.target.value); document.getElementById("jb-city").value = k.city; document.getElementById("jb-prov").value = k.prov; }
  if (e.target.closest?.("#job-form")) { const el = document.getElementById("job-checks"); if (el) el.innerHTML = jobChecksHtml(jobFromForm()); }
});
document.addEventListener("input", e => { if (e.target.closest?.("#job-form")) { const el = document.getElementById("job-checks"); if (el) el.innerHTML = jobChecksHtml(jobFromForm()); } if (e.target.id === "cand-filter") { ui.candText = e.target.value; render(); } if (e.target.id === "login-email") ui.loginEmail = e.target.value; });
document.addEventListener("submit", e => {
  e.preventDefault();
  const v = id => document.getElementById(id)?.value?.trim() ?? "";
  switch (e.target.id) {
    case "login-form": {
      const r = DB.recruiters.find(x => x.email.toLowerCase() === v("login-email").toLowerCase());
      if (!r || v("login-pw") !== "demo") { ui.loginErr = "Email or password is wrong. Pick a demo account above; the password is “demo”."; render(); return; }
      setMe(r.id); ui.loginErr = null; ui.view = "home"; render(); break;
    }
    case "top-search": doSearch(v("top-q")); break;
    case "ask-form": doSearch(v("ask-q")); break;
    case "log-form": {
      const c = cand(ui.id), s = v("log-text"), dt = v("log-date") || ago(0);
      c.comms.push({ d: dt, type: v("log-type"), s });
      if (document.getElementById("log-memo").checked) c.memory.push({ d: dt, tag: "Preference", t: s });
      ui.modal = null; save(); toast("Contact logged"); break;
    }
    case "memo-form": { cand(ui.id).memory.push({ d: ago(0), tag: v("memo-tag"), t: v("memo-text") }); ui.modal = null; save(); toast("Memory card saved"); break; }
    case "li-form": {
      const u = cleanLinkedIn(v("li-url"));
      if (u === null) { ui.liErr = "Use a profile link like https://www.linkedin.com/in/name"; render(); return; }
      cand(ui.id).linkedin = u; ui.modal = null; ui.liErr = null; save(); toast(u ? "LinkedIn link saved" : "LinkedIn link removed"); break;
    }
    case "job-form": {
      if (!can("addJob")) break;
      const d = jobFromForm();
      if (!d.modes.length) { toast("Pick at least one work mode"); return; }
      if (!d.salary) d.salary = { min: 0, max: 0, type: "annual" };
      const j = { id: uid("j"), ...d, manager: me, status: "Open", opened: ago(0), pipeline: [] };
      DB.jobs.push(j); save(); ui.modal = null; ui.view = "job"; ui.id = j.id; toast(j.recruiters.length ? `Job created and assigned to ${j.recruiters.map(firstName).join(", ")}` : "Job created. Assign a recruiter on the right."); break;
    }
    case "user-form": {
      if (!can("manageUsers")) break;
      const name = v("u-name"), email = v("u-email");
      if (DB.recruiters.some(u => u.email.toLowerCase() === email.toLowerCase())) { toast("Someone already uses that email"); return; }
      DB.recruiters.push({ id: uid("u"), name, initials: initials(name), desk: v("u-desk") || "Not set", email, role: v("u-role") }); save(); toast(`${name} added`); break;
    }
    case "client-form": {
      if (!can("addClient")) break;
      const lines = id => v(id).split("\n").map(x => x.trim()).filter(Boolean);
      const k = { id: uid("k"), owner: me, name: v("k-name"), industry: v("k-industry") || "Not set", city: v("k-city"), prov: v("k-prov"), size: +v("k-size") || 0,
        contacts: v("k-cname") ? [{ n: v("k-cname"), r: v("k-crole") || "Hiring contact", e: v("k-cemail") }] : [],
        prefs: lines("k-prefs"), avoid: lines("k-avoid"), fee: v("k-fee") || "Not agreed", guarantee: v("k-guarantee") || "Not agreed", lastContact: ago(0) };
      DB.clients.push(k); save(); ui.modal = null; ui.view = "client"; ui.id = k.id; toast("Client added"); break;
    }
    case "pref-form": { if (!can("editClient")) break; client(ui.id).prefs.push(v("pref-text")); save(); toast("Preference added"); break; }
    case "cand-form": {
      const smin = +v("f-smin") || 0, smax = +v("f-smax") || smin;
      const c = { id: uid("c"), owner: me, name: v("f-name"), title: v("f-title"), city: v("f-city") || "Unknown", prov: v("f-prov"), email: v("f-email"), phone: v("f-phone"),
        years: +v("f-years") || 0, designations: v("f-desig").split(",").map(s => s.trim()).filter(Boolean), langs: v("f-langs").split(",").map(s => s.trim()).filter(Boolean),
        auth: v("f-auth"), status: "Active", salary: { min: smin, max: smax, type: "annual" }, modes: [v("f-mode")], relocate: false, notice: v("f-notice"),
        skills: v("f-skills").split(",").map(s => s.trim()).filter(Boolean).map(n => ({ n, y: Math.max(1, Math.round((+v("f-years") || 2) * .7)) })),
        pains: v("f-pain").split("\n").map(s => s.trim()).filter(Boolean), motives: [], memory: [],
        comms: [{ d: ago(0), type: "Email", s: `Résumé received (${ui.upload.file}).` }],
        consent: v("f-consent") === "Pending" ? { date: ago(0), method: "Pending", casl: v("f-casl"), retainUntil: addDays(ago(0), 30) } : { date: ago(0), method: v("f-consent"), casl: v("f-casl"), retainUntil: addDays(ago(0), Math.round(+v("f-retain") * 30.4)) },
        resume: ui.upload.file, resumeDate: ago(0), resumeText: (ui.upload.text || "").slice(0, 20000), linkedin: cleanLinkedIn(v("f-linkedin")) || "" };
      DB.candidates.push(c); save(); ui.upload = null; ui.modal = null; ui.view = "candidate"; ui.id = c.id; toast("Candidate saved to your desk"); break;
    }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.modal) { ui.modal = null; render(); } });

load();
render();
